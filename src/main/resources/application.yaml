server:
  port: 8080

spring:
  application:
    name: architecture-solution

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommerce}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
