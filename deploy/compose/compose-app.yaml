services:
  as:
    image: ghcr.io/binhphuc/architecturesolution:latest
    container_name: architecturesolution
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:?APP_ENV_FILE is required}
    ports:
      - "8080:8080"
    networks:
      - as

networks:
  as:
    external: true
    name: architecture_solution
